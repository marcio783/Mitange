<title>TechFix Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout: barra superior escura, conteúdo central de 1100px; cartões brancos sobre fundo azulado. */
  :root {
    --bg: #f1f4f9; --surface: #ffffff; --fg: #1a2133; --muted: #5f6b83; --line: #dfe5ef;
    --hover: #f3f6fc; --accent: #2b57cf; --accent-fg: #ffffff; --top: #121d3a; --top-fg: #c9d2ea;
    --st-pend: #d96f0c; --st-ana: #2b72c4; --st-ag: #7048c4; --st-conc: #178a50; --st-ent: #6f7a90;
    --danger: #cc3333; --warn-bg: #fff4e4; --warn-line: #f3d09b; --crit-bg: #fdecec; --crit-line: #efb9b9;
    --toast: #263049; --shadow: 0 1px 2px rgba(18,29,58,.06), 0 6px 18px rgba(18,29,58,.06);
    --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1525; --surface: #162036; --fg: #e5e9f4; --muted: #9aa5be; --line: #27324d;
      --hover: #1b2742; --accent: #7a9bf6; --accent-fg: #0e1525; --top: #09101f; --top-fg: #aeb9d6;
      --warn-bg: #3a2a12; --warn-line: #6b4d1f; --crit-bg: #3b1b1d; --crit-line: #70302f; --danger: #f07878;
      --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1525; --surface: #162036; --fg: #e5e9f4; --muted: #9aa5be; --line: #27324d;
    --hover: #1b2742; --accent: #7a9bf6; --accent-fg: #0e1525; --top: #09101f; --top-fg: #aeb9d6;
    --warn-bg: #3a2a12; --warn-line: #6b4d1f; --crit-bg: #3b1b1d; --crit-line: #70302f; --danger: #f07878;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45; }
  h1 { font-size: 1.5rem; margin: 0 0 1rem; text-wrap: balance; }
  h2 { font-size: 1.1rem; margin: 0; }
  h3 { font-size: 1rem; margin: 0 0 .75rem; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .notice { background: var(--warn-bg); border-bottom: 1px solid var(--warn-line); padding: .45rem 16px; font-size: .82rem; text-align: center; }
  .topbar { background: var(--top); color: var(--top-fg); display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: .7rem 16px; }
  .brand { font-size: 1.15rem; font-weight: 600; color: #fff; letter-spacing: .01em; }
  .brand b { color: #8fb0ff; font-weight: 700; }
  nav { display: flex; gap: .25rem; }
  .tab { background: transparent; border: 0; color: inherit; padding: .5rem .9rem; border-radius: 6px; cursor: pointer; }
  .tab:hover { background: rgba(255,255,255,.08); }
  .tab.active { background: var(--accent); color: var(--accent-fg); }
  .content { max-width: 1100px; margin: 0 auto; padding: 1.5rem 16px 3rem; }

  .stack { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
  .row { display: flex; gap: .5rem; align-items: center; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 1rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; box-shadow: var(--shadow); min-width: 0; }
  .card.flat { box-shadow: none; }
  .muted { color: var(--muted); }
  .center { text-align: center; }
  .err { color: var(--danger); }

  .metric { display: flex; flex-direction: column; gap: .25rem; border-top: 4px solid var(--accent); }
  .metric.o { border-top-color: var(--st-pend); } .metric.g { border-top-color: var(--st-conc); }
  .metric-label { color: var(--muted); font-size: .85rem; }
  .metric-value { font-family: var(--mono); font-size: 1.7rem; font-weight: 500; font-variant-numeric: tabular-nums; }

  ul.plain { list-style: none; margin: 0; padding: 0; }
  .alert { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .6rem .75rem; border-radius: 8px; background: var(--warn-bg); border: 1px solid var(--warn-line); margin-bottom: .5rem; }
  .alert small { display: block; color: var(--muted); }
  .alert.crit { background: var(--crit-bg); border-color: var(--crit-line); }
  .pill { font-weight: 600; font-size: .78rem; padding: .15rem .55rem; border: 1px solid currentColor; border-radius: 999px; white-space: nowrap; color: var(--st-pend); }
  .alert.crit .pill { color: var(--danger); }

  .sbar li { margin-bottom: .7rem; }
  .linkrow { display: flex; align-items: center; gap: .5rem; width: 100%; background: none; border: 0; padding: .15rem 0; cursor: pointer; text-align: left; }
  .linkrow:hover .grow { text-decoration: underline; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 999px; }
  .c-pend { background: var(--st-pend); } .c-ana { background: var(--st-ana); } .c-ag { background: var(--st-ag); }
  .c-conc { background: var(--st-conc); } .c-ent { background: var(--st-ent); }
  .badge { display: inline-block; padding: .18rem .65rem; border-radius: 999px; font-size: .76rem; font-weight: 600; color: #fff; white-space: nowrap; }

  .input { width: 100%; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  textarea.input { resize: vertical; }
  .field { display: flex; flex-direction: column; gap: .25rem; margin-top: .75rem; }
  .field > span { font-size: .8rem; color: var(--muted); font-weight: 600; }
  .toolbar { display: flex; gap: .6rem; flex-wrap: wrap; }
  .toolbar select.input { width: auto; min-width: 180px; }
  .btn { padding: .5rem .95rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
  .btn:hover:not(:disabled) { background: var(--hover); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  .icon-btn { border: 0; background: transparent; font-size: 1.4rem; line-height: 1; cursor: pointer; color: var(--muted); padding: .1rem .45rem; border-radius: 6px; }
  .icon-btn:hover { background: var(--hover); }
  .icon-btn.danger:hover { color: var(--danger); background: var(--crit-bg); }
  .qty { width: 4.2rem; text-align: center; padding: .45rem; }

  .tablewrap { padding: 0; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: .75rem .9rem; border-bottom: 1px solid var(--line); background: var(--hover); }
  td { padding: .7rem .9rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--hover); }
  table.compact th, table.compact td { padding: .45rem .5rem; }
  .trunc { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mono { font-family: var(--mono); }

  .backdrop { position: fixed; inset: 0; background: rgba(8,13,28,.55); display: flex; align-items: flex-start; justify-content: center; padding: 3vh 16px; overflow-y: auto; z-index: 50; }
  .modal { background: var(--bg); border-radius: 12px; width: 100%; max-width: 1000px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: .85rem 1.2rem; border-bottom: 1px solid var(--line); background: var(--surface); border-radius: 12px 12px 0 0; }
  .modal-body { padding: 1.2rem; }
  .os-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: start; }
  .details { display: grid; grid-template-columns: 8rem 1fr; gap: .3rem .75rem; margin: .75rem 0 0; }
  .details dt { color: var(--muted); font-size: .85rem; } .details dd { margin: 0; }
  .part { display: flex; align-items: center; gap: .5rem; padding: .55rem 0; border-bottom: 1px solid var(--line); }
  .part:last-child { border-bottom: 0; } .part small { display: block; }
  .sum .r { display: flex; justify-content: space-between; padding: .35rem 0; font-variant-numeric: tabular-nums; }
  .sum .t { border-top: 2px solid var(--fg); margin-top: .4rem; padding-top: .6rem; font-size: 1.2rem; }

  .toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: .5rem; z-index: 100; max-width: min(420px, calc(100vw - 32px)); }
  .toast { display: flex; justify-content: space-between; gap: .75rem; padding: .7rem .9rem; border-radius: 10px; color: #fff; background: var(--toast); box-shadow: var(--shadow); }
  .toast.ok { background: var(--st-conc); } .toast.error { background: #c23030; }
  .toast button { background: transparent; border: 0; color: inherit; font-size: 1.2rem; line-height: 1; cursor: pointer; }
  @media (max-width: 800px) { .os-layout { grid-template-columns: 1fr; } .hide-sm { display: none; } }
  @media (prefers-reduced-motion: no-preference) { .toast { animation: up .18s ease-out; } @keyframes up { from { opacity: 0; transform: translateY(8px); } } }
</style>

<div class="notice">Prévia visual com dados fictícios. No sistema real, os dados vêm do backend FastAPI e do SQLite.</div>
<header class="topbar">
  <div class="brand">TechFix <b>Pro</b></div>
  <nav>
    <button class="tab active" id="tabDash" type="button">Dashboard</button>
    <button class="tab" id="tabOS" type="button">Ordens de Serviço</button>
  </nav>
</header>
<main class="content"><h1 id="title">Visão geral</h1><div id="view"></div></main>
<div id="modalRoot"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let nf; try { nf = new Intl.NumberFormat('pt-AO', { style: 'currency', currency: 'AOA' }); } catch (e) { nf = { format: (v) => v.toFixed(2) + ' Kz' }; }
  const money = (v) => nf.format(v);
  const when = (d) => d.toLocaleString('pt-PT', { dateStyle: 'short', timeStyle: 'short' });
  const ago = (h) => new Date(Date.now() - h * 3600e3);
  const STATUS = {
    PENDENTE: { label: 'Pendente', c: 'pend' }, EM_ANALISE: { label: 'Em análise', c: 'ana' },
    AGUARDANDO_PECA: { label: 'Aguardando peça', c: 'ag' }, CONCLUIDO: { label: 'Concluído', c: 'conc' },
    ENTREGUE: { label: 'Entregue', c: 'ent' },
  };
  const badge = (s) => `<span class="badge c-${STATUS[s].c}">${STATUS[s].label}</span>`;

  /* ---------- dados fictícios ---------- */
  const pecas = [
    { id: 1, nome: 'SSD 500GB NVMe', venda: 350.5, estoque: 7, min: 3 },
    { id: 2, nome: 'Memória RAM 8GB DDR4', venda: 160, estoque: 1, min: 4 },
    { id: 3, nome: 'Tela LCD 13.3"', venda: 650, estoque: 3, min: 3 },
    { id: 4, nome: 'Bateria Notebook Universal', venda: 220, estoque: 10, min: 4 },
    { id: 5, nome: 'Tela OLED Smartphone', venda: 520, estoque: 1, min: 2 },
    { id: 6, nome: 'Conector de Carga USB-C', venda: 45, estoque: 24, min: 10 },
    { id: 7, nome: 'Pasta Térmica 4g', venda: 20, estoque: 39, min: 10 },
  ];
  const item = (id, peca, q) => ({ id, pecaId: peca, nome: pecas.find((p) => p.id === peca).nome, qtd: q, preco: pecas.find((p) => p.id === peca).venda });
  let nextItem = 100;
  const ordens = [
    { id: 6, cliente: 'Maria Silva', tel: '+244 923 456 789', equip: 'Notebook · Dell XPS 13', serie: 'SN-DELL-001', defeito: 'Lentidão extrema', diag: 'Troca de HDD por SSD', mao: 90, status: 'CONCLUIDO', created: ago(30), updated: ago(3), itens: [item(1, 1, 1), item(2, 2, 1)] },
    { id: 5, cliente: 'Maria Silva', tel: '+244 923 456 789', equip: 'Smartphone · iPhone 12', serie: 'IMEI-9910', defeito: 'Bateria viciada', diag: '', mao: 40, status: 'PENDENTE', created: ago(8), updated: ago(8), itens: [] },
    { id: 4, cliente: 'Carlos Mendes', tel: '+244 945 678 901', equip: 'Tablet · iPad 9ª geração', serie: 'SN-IPAD-42', defeito: 'Não carrega', diag: 'Conector USB-C danificado', mao: 50, status: 'ENTREGUE', created: ago(60), updated: ago(20), itens: [item(3, 6, 1)] },
    { id: 3, cliente: 'Ana Costa', tel: '+244 934 567 890', equip: 'Notebook · Lenovo ThinkPad T14', serie: 'SN-LEN-778', defeito: 'Superaquecimento', diag: 'Limpeza e troca de pasta térmica', mao: 60, status: 'CONCLUIDO', created: ago(50), updated: ago(12), itens: [item(4, 7, 1)] },
    { id: 2, cliente: 'João Pereira', tel: '+244 912 345 678', equip: 'Smartphone · Samsung Galaxy S21', serie: 'IMEI-3521', defeito: 'Tela quebrada', diag: 'Troca de tela', mao: 80, status: 'EM_ANALISE', created: ago(26), updated: ago(5), itens: [] },
    { id: 1, cliente: 'Maria Silva', tel: '+244 923 456 789', equip: 'Notebook · Dell XPS 13', serie: 'SN-DELL-001', defeito: 'Notebook não liga', diag: 'Fonte e SSD com defeito', mao: 120, status: 'AGUARDANDO_PECA', created: ago(72), updated: ago(40), itens: [] },
  ];
  const totalPecas = (o) => o.itens.reduce((s, i) => s + i.qtd * i.preco, 0);
  const total = (o) => o.mao + totalPecas(o);

  /* ---------- toast ---------- */
  function toast(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = `<span>${esc(msg)}</span><button type="button" aria-label="Fechar aviso">×</button>`;
    const kill = () => el.remove();
    el.querySelector('button').onclick = kill;
    $('#toasts').appendChild(el);
    setTimeout(kill, type === 'error' ? 6500 : 3500);
  }
  const debounce = (fn, ms = 300) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

  /* ---------- navegação ---------- */
  let aba = 'dash';
  const filtro = { q: '', status: '' };
  function go(a) {
    aba = a;
    $('#tabDash').classList.toggle('active', a === 'dash');
    $('#tabOS').classList.toggle('active', a === 'os');
    render();
  }
  $('#tabDash').onclick = () => go('dash');
  $('#tabOS').onclick = () => { filtro.status = ''; go('os'); };
  const render = () => (aba === 'dash' ? renderDash() : renderOS());

  /* ---------- dashboard ---------- */
  function renderDash() {
    $('#title').textContent = 'Visão geral';
    const abertas = ordens.filter((o) => !['CONCLUIDO', 'ENTREGUE'].includes(o.status)).length;
    const fechadas = ordens.filter((o) => ['CONCLUIDO', 'ENTREGUE'].includes(o.status));
    const fat = fechadas.reduce((s, o) => s + total(o), 0);
    const alertas = pecas.filter((p) => p.estoque <= p.min).sort((a, b) => a.estoque - a.min - (b.estoque - b.min));
    const cont = Object.fromEntries(Object.keys(STATUS).map((s) => [s, ordens.filter((o) => o.status === s).length]));
    const max = Math.max(1, ...Object.values(cont));
    $('#view').innerHTML = `
      <div class="stack">
        <section class="grid-3">
          <div class="card metric o"><span class="metric-label">OS abertas</span><strong class="metric-value">${abertas}</strong></div>
          <div class="card metric g"><span class="metric-label">OS concluídas no mês</span><strong class="metric-value">${fechadas.length}</strong></div>
          <div class="card metric"><span class="metric-label">Faturamento do mês</span><strong class="metric-value">${money(fat)}</strong></div>
        </section>
        <section class="grid-2">
          <div class="card"><h3>Alertas de estoque baixo</h3>
            ${alertas.length ? `<ul class="plain">${alertas.map((p) => `<li class="alert ${p.estoque === 0 ? 'crit' : ''}"><div><strong>${esc(p.nome)}</strong><small>Mínimo: ${p.min}</small></div><span class="pill">${p.estoque === 0 ? 'Esgotada' : p.estoque + ' em estoque'}</span></li>`).join('')}</ul>` : '<p class="muted">Nenhuma peça abaixo do estoque mínimo.</p>'}
          </div>
          <div class="card"><h3>Ordens por status</h3>
            <ul class="plain sbar">${Object.keys(STATUS).map((s) => `<li><button type="button" class="linkrow" data-st="${s}"><span class="dot c-${STATUS[s].c}"></span><span class="grow">${STATUS[s].label}</span><strong>${cont[s]}</strong></button><div class="bar"><div class="c-${STATUS[s].c}" style="width:${(cont[s] / max) * 100}%"></div></div></li>`).join('')}</ul>
          </div>
        </section>
      </div>`;
    document.querySelectorAll('[data-st]').forEach((b) => (b.onclick = () => { filtro.status = b.dataset.st; go('os'); }));
  }

  /* ---------- lista de OS ---------- */
  function renderOS() {
    $('#title').textContent = 'Ordens de Serviço';
    $('#view').innerHTML = `
      <div class="stack">
        <div class="toolbar">
          <input class="input grow" id="busca" type="search" placeholder="Buscar por cliente, equipamento ou nº da OS…" value="${esc(filtro.q)}" aria-label="Buscar ordens de serviço">
          <select class="input" id="fStatus" aria-label="Filtrar por status"><option value="">Todos os status</option>${Object.keys(STATUS).map((s) => `<option value="${s}" ${filtro.status === s ? 'selected' : ''}>${STATUS[s].label}</option>`).join('')}</select>
          <button class="btn primary" type="button" id="nova">+ Nova OS</button>
        </div>
        <div class="card tablewrap"><table><thead><tr><th>OS</th><th>Cliente</th><th>Equipamento</th><th class="hide-sm">Defeito relatado</th><th>Status</th><th class="num">Total</th><th class="hide-sm">Atualizada</th></tr></thead><tbody id="rows"></tbody></table></div>
      </div>`;
    $('#busca').oninput = debounce((e) => { filtro.q = e.target.value; rows(); }, 300);
    $('#fStatus').onchange = (e) => { filtro.status = e.target.value; rows(); };
    $('#nova').onclick = () => toast('Na versão real, abre o formulário de nova OS (cliente, equipamento e defeito).');
    rows();
  }
  function rows() {
    const q = filtro.q.trim().toLowerCase();
    const l = ordens.filter((o) => (!filtro.status || o.status === filtro.status) &&
      (!q || o.cliente.toLowerCase().includes(q) || o.equip.toLowerCase().includes(q) || String(o.id) === q.replace('#', '')));
    $('#rows').innerHTML = l.length ? l.map((o) => `<tr class="click" data-id="${o.id}"><td class="mono">#${o.id}</td><td>${esc(o.cliente)}</td><td>${esc(o.equip)}</td><td class="hide-sm trunc">${esc(o.defeito)}</td><td>${badge(o.status)}</td><td class="num">${money(total(o))}</td><td class="hide-sm muted">${when(o.updated)}</td></tr>`).join('')
      : '<tr><td colspan="7" class="muted center">Nenhuma ordem de serviço encontrada.</td></tr>';
    document.querySelectorAll('#rows tr[data-id]').forEach((tr) => (tr.onclick = () => openModal(Number(tr.dataset.id))));
  }

  /* ---------- modal de detalhes ---------- */
  function openModal(id) {
    const o = ordens.find((x) => x.id === id);
    const root = $('#modalRoot');
    root.innerHTML = `
      <div class="backdrop" id="bd"><div class="modal" role="dialog" aria-modal="true" aria-label="Ordem de Serviço ${id}">
        <header class="modal-head"><h2>Ordem de Serviço #${id}</h2><button class="icon-btn" id="mx" type="button" aria-label="Fechar">×</button></header>
        <div class="modal-body"><div class="os-layout">
          <div class="stack">
            <section class="card flat">
              <div class="row between wrap"><div><strong>${esc(o.cliente)}</strong><div class="muted">${esc(o.tel)}</div></div><span id="mBadge"></span></div>
              <dl class="details"><dt>Equipamento</dt><dd>${esc(o.equip)} (${esc(o.serie)})</dd><dt>Defeito relatado</dt><dd>${esc(o.defeito)}</dd><dt>Aberta em</dt><dd>${when(o.created)}</dd></dl>
              <label class="field"><span>Status</span><select class="input" id="mStatus">${Object.keys(STATUS).map((s) => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${STATUS[s].label}</option>`).join('')}</select></label>
              <label class="field"><span>Diagnóstico técnico</span><textarea class="input" id="mDiag" rows="3">${esc(o.diag)}</textarea></label>
              <label class="field"><span>Mão de obra</span><input class="input" id="mMao" type="number" min="0" step="0.01" value="${o.mao}"></label>
              <div class="field"><button class="btn" id="mSave" type="button">Salvar alterações</button></div>
            </section>
            <section class="card flat"><h3>Peças utilizadas</h3><div id="mItens"></div></section>
          </div>
          <div class="stack">
            <section class="card flat"><h3>Adicionar peças</h3>
              <p class="muted" id="mLock" hidden>OS entregue: peças não podem mais ser alteradas.</p>
              <input class="input" id="mTermo" type="search" placeholder="Pesquisar peça pelo nome…" aria-label="Pesquisar peça">
              <ul class="plain" id="mParts" style="margin-top:.5rem"></ul>
            </section>
            <section class="card flat sum"><h3>Resumo financeiro</h3><div id="mSum"></div></section>
          </div>
        </div></div>
      </div></div>`;
    const close = () => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); render(); };
    const onKey = (e) => e.key === 'Escape' && close();
    document.addEventListener('keydown', onKey);
    $('#mx').onclick = close;
    $('#bd').onmousedown = (e) => e.target.id === 'bd' && close();

    const locked = () => o.status === 'ENTREGUE';
    function paintItens() {
      $('#mItens').innerHTML = o.itens.length ? `<div style="overflow-x:auto"><table class="compact"><thead><tr><th>Peça</th><th class="num">Qtd</th><th class="num">Unit.</th><th class="num">Subtotal</th><th></th></tr></thead><tbody>${o.itens.map((i) => `<tr><td>${esc(i.nome)}</td><td class="num">${i.qtd}</td><td class="num">${money(i.preco)}</td><td class="num">${money(i.qtd * i.preco)}</td><td class="num"><button class="icon-btn danger" type="button" data-rm="${i.id}" ${locked() ? 'disabled' : ''} title="Remover e devolver ao estoque" aria-label="Remover ${esc(i.nome)}">×</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Nenhuma peça adicionada ainda.</p>';
      $('#mItens').querySelectorAll('[data-rm]').forEach((b) => (b.onclick = () => {
        const k = o.itens.findIndex((i) => i.id === Number(b.dataset.rm)); const it = o.itens[k];
        pecas.find((p) => p.id === it.pecaId).estoque += it.qtd; o.itens.splice(k, 1); o.updated = new Date();
        toast(`${it.nome} removida; estoque devolvido.`, 'ok'); paintAll();
      }));
    }
    function paintSum() {
      $('#mSum').innerHTML = `<div class="r"><span>Mão de obra</span><span>${money(o.mao)}</span></div><div class="r"><span>+ Peças</span><span>${money(totalPecas(o))}</span></div><div class="r t"><span>= Total</span><strong>${money(total(o))}</strong></div>`;
    }
    function paintParts() {
      const t = $('#mTermo').value.trim().toLowerCase();
      const l = pecas.filter((p) => p.nome.toLowerCase().includes(t)).slice(0, 8);
      $('#mParts').innerHTML = l.length ? l.map((p) => `<li class="part"><div class="grow"><strong>${esc(p.nome)}</strong><small class="${p.estoque === 0 ? 'err' : 'muted'}">${money(p.venda)} · ${p.estoque === 0 ? 'sem estoque' : p.estoque + ' em estoque'}</small></div><input class="input qty" type="number" min="1" value="1" id="q${p.id}" aria-label="Quantidade de ${esc(p.nome)}" ${locked() ? 'disabled' : ''}><button class="btn primary" type="button" data-add="${p.id}" ${locked() ? 'disabled' : ''}>Adicionar</button></li>`).join('') : '<li class="muted">Nenhuma peça encontrada.</li>';
      $('#mParts').querySelectorAll('[data-add]').forEach((b) => (b.onclick = () => {
        const p = pecas.find((x) => x.id === Number(b.dataset.add));
        const q = Number($('#q' + p.id).value);
        if (!Number.isInteger(q) || q < 1) return toast('Informe uma quantidade inteira maior que zero.', 'error');
        if (p.estoque < q) return toast(`Estoque insuficiente para '${p.nome}': disponível ${p.estoque}, solicitado ${q}`, 'error'); // 400 + ROLLBACK no backend real
        p.estoque -= q; o.itens.push({ id: nextItem++, pecaId: p.id, nome: p.nome, qtd: q, preco: p.venda }); o.updated = new Date();
        toast(`${q}× ${p.nome} adicionada à OS.`, 'ok'); paintAll();
      }));
    }
    function paintAll() { $('#mBadge').innerHTML = badge(o.status); $('#mLock').hidden = !locked(); paintItens(); paintSum(); paintParts(); }
    $('#mTermo').oninput = debounce(paintParts, 300);
    $('#mStatus').onchange = (e) => { o.status = e.target.value; o.updated = new Date(); toast(`Status alterado para "${STATUS[o.status].label}".`, 'ok'); paintAll(); };
    $('#mSave').onclick = () => {
      const v = Number(String($('#mMao').value).replace(',', '.'));
      if (!Number.isFinite(v) || v < 0) return toast('Informe um valor de mão de obra válido (≥ 0).', 'error');
      o.mao = v; o.diag = $('#mDiag').value.trim(); o.updated = new Date(); toast('Dados da OS atualizados.', 'ok'); paintAll();
    };
    paintAll();
  }

  render();
})();
</script>
